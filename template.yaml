- binary_sensor:
  - name: Scylla Driving
    unique_id: scylla_driving
    default_entity_id: binary_sensor.scylla_driving
    device_class: moving
    availability: "{{ has_value('sensor.scylla_speed') }}"
    state: "{{ states('sensor.scylla_speed') | float(0) > 0 }}"

  - name: Scylla Minute to Full Charge
    unit_of_measurement: m
    icon: mdi:clock-outline
    unique_id: scylla_minute_to_full_charge
    state: "{{ (states('sensor.scylla_time_to_full_charge') | float * 60 ) | round(0) }}"

- sensor:
    # Range in miles. The car's range sensors come from TeslaMate over MQTT and are always
    # in km, whatever the car's own unit setting, so miles are a plain conversion.
    - name: Scylla Est Battery Range Mi
      unique_id: scylla_est_battery_range_mi
      unit_of_measurement: mi
      icon: mdi:gauge
      availability: "{{ states('sensor.scylla_est_battery_range') | is_number }}"
      state: >
        {{ (states('sensor.scylla_est_battery_range') | float(0) / 1.609344) | round(1) }}

    # Optional extras (not used by the scheduler). Confirm sensor.scylla_rated_battery_range and
    # sensor.scylla_ideal_battery_range exist in Developer Tools → States.
    - name: Scylla Rated Battery Range Mi
      unique_id: scylla_rated_battery_range_mi
      unit_of_measurement: mi
      icon: mdi:gauge
      availability: "{{ states('sensor.scylla_rated_battery_range') | is_number }}"
      state: >
        {{ (states('sensor.scylla_rated_battery_range') | float(0) / 1.609344) | round(1) }}

    - name: Scylla Ideal Battery Range Mi
      unique_id: scylla_ideal_battery_range_mi
      unit_of_measurement: mi
      icon: mdi:gauge
      availability: "{{ states('sensor.scylla_ideal_battery_range') | is_number }}"
      state: >
        {{ (states('sensor.scylla_ideal_battery_range') | float(0) / 1.609344) | round(1) }}

