- binary_sensor:
  - name: Scylla Driving
    unique_id: scylla_driving
    default_entity_id: binary_sensor.scylla_driving
    device_class: moving
    availability: "{{ has_value('sensor.scylla_speed') }}"
    state: "{{ states('sensor.scylla_speed') | float(0) > 0 }}"

  # ON when the car is at one of your charging locations. The list is the text
  # helper input_text.scylla_charging_locations, comma-separated, e.g.
  # "home, Chalet, Work" — "home" or the name of any zone on the HA map
  # (Settings → Areas, labels & zones → Zones). Not case-sensitive. Empty = "home".
  # The scheduler and the helper only plan, protect and stop charges while this
  # is ON; away from these places the car charges normally.
  # delay_off 3 min: a GPS jump or a TeslaMate reconnect (tracker briefly
  # "not_home"/unavailable) doesn't count as leaving and doesn't reset anything.
  - name: Scylla At Charging Location
    unique_id: scylla_at_charging_location
    default_entity_id: binary_sensor.scylla_at_charging_location
    icon: mdi:home-lightning-bolt-outline
    availability: "{{ has_value('device_tracker.scylla_location') }}"
    delay_off:
      minutes: 3
    state: >
      {% set raw = states('input_text.scylla_charging_locations') %}
      {% set raw = raw if has_value('input_text.scylla_charging_locations') and raw | trim != '' else 'home' %}
      {% set places = raw.split(',') | map('trim') | map('lower') | reject('eq', '') | list %}
      {{ states('device_tracker.scylla_location') | lower in places }}
    attributes:
      location: "{{ states('device_tracker.scylla_location') }}"
      charging_locations: "{{ states('input_text.scylla_charging_locations') }}"

- sensor:
  - name: Scylla Minute to Full Charge
    # "min" = minutes ("m" is metres in Home Assistant)
    unit_of_measurement: min
    device_class: duration
    icon: mdi:clock-outline
    unique_id: scylla_minute_to_full_charge
    # unavailable (instead of a template error in the log) while TeslaMate
    # has no value
    availability: "{{ states('sensor.scylla_time_to_full_charge') | is_number }}"
    state: "{{ (states('sensor.scylla_time_to_full_charge') | float(0) * 60) | round(0) }}"

- sensor:
    # Range in miles. The car's range sensors come from TeslaMate over MQTT and are always
    # in km, whatever the car's own unit setting, so miles are a plain conversion.
    - name: Scylla Est Battery Range Mi
      unique_id: scylla_est_battery_range_mi
      unit_of_measurement: mi
      icon: mdi:gauge
      availability: "{{ states('sensor.scylla_est_battery_range') | is_number }}"
      state: >
        {{ (states('sensor.scylla_est_battery_range') | float(0) / 1.609344) | round(1) }}

    # Optional extras (the rated range is used by Scylla Effective Range below). Confirm sensor.scylla_rated_battery_range and
    # sensor.scylla_ideal_battery_range exist in Developer Tools → States.
    - name: Scylla Rated Battery Range Mi
      unique_id: scylla_rated_battery_range_mi
      unit_of_measurement: mi
      icon: mdi:gauge
      availability: "{{ states('sensor.scylla_rated_battery_range') | is_number }}"
      state: >
        {{ (states('sensor.scylla_rated_battery_range') | float(0) / 1.609344) | round(1) }}

    - name: Scylla Ideal Battery Range Mi
      unique_id: scylla_ideal_battery_range_mi
      unit_of_measurement: mi
      icon: mdi:gauge
      availability: "{{ states('sensor.scylla_ideal_battery_range') | is_number }}"
      state: >
        {{ (states('sensor.scylla_ideal_battery_range') | float(0) / 1.609344) | round(1) }}

    # ── Range used by the scheduler (km) ────────────────────────────────────
    # The scheduler converts a target range (km / mi) into a battery % from the
    # car's range per %. Tesla firmware 2026.14.x stopped sending the
    # ESTIMATED range (TeslaMate issue #5298: sensor.scylla_est_battery_range
    # stays unknown), so:
    #   • estimated range, when the car still reports it (> 0);
    #   • otherwise the RATED range × scylla_rated_range_factor, because the
    #     rated range is higher than what you really get (cold, highway).
    # The attribute `source` says which one is in use.
    # (No device_class: with `distance` HA would convert the value to the
    # unit system of your instance, and the km / mi sensors would no longer
    # match their names.)
    - name: Scylla Effective Range
      unique_id: scylla_effective_range
      unit_of_measurement: km
      state_class: measurement
      icon: mdi:gauge
      availability: >
        {{ states('sensor.scylla_est_battery_range') | float(0) > 0
           or states('sensor.scylla_rated_battery_range') | float(0) > 0 }}
      state: >
        {% set est = states('sensor.scylla_est_battery_range') | float(0) %}
        {% set rated = states('sensor.scylla_rated_battery_range') | float(0) %}
        {% set factor = states('input_number.scylla_rated_range_factor') | float(85) / 100 %}
        {{ (est if est > 0 else rated * factor) | round(1) }}
      attributes:
        source: >
          {{ 'estimated' if states('sensor.scylla_est_battery_range') | float(0) > 0
             else 'rated × factor' }}

    # Same in miles (the conversion is a plain division: the sensors are km).
    - name: Scylla Effective Range Mi
      unique_id: scylla_effective_range_mi
      unit_of_measurement: mi
      state_class: measurement
      icon: mdi:gauge
      availability: "{{ states('sensor.scylla_effective_range') | is_number }}"
      state: "{{ (states('sensor.scylla_effective_range') | float(0) / 1.609344) | round(1) }}"

