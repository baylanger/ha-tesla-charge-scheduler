    # Always-available usable battery level — holds last known value when the
    # car sleeps and sensor.scylla_usable_battery_level goes unavailable.
    # A reading of 0 is treated as "no reading" too (TeslaMate sometimes
    # publishes 0 while the car wakes up).
    # This is what closed the "missed 4:51 charge" bug: the scheduler's gate
    # condition used the raw sensor directly, and float(0) on 'unavailable'
    # made the gate evaluate to 0, silently skipping the whole schedule
    # instead of just re-arming it on the next trigger.
    - name: "Scylla Usable Battery Level Safe"
      unique_id: scylla_usable_battery_level_safe
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      state: >
        {% set raw = states('sensor.scylla_usable_battery_level') %}
        {% if raw | is_number and raw | float > 0 %}
          {{ raw | float }}
        {% else %}
          {{ states('input_number.scylla_last_known_battery') | float(0) }}
        {% endif %}

    # Always-available charging amps: the car's amps while it is really
    # charging, otherwise the planned amps (input_number.scylla_set_charging_amps).
    # Uses sensor.scylla_charging_state, not binary_sensor.scylla_charging:
    # TeslaMate can leave that binary sensor "on" for hours after a charge.
    - name: "Scylla Charging Amps"
      unique_id: scylla_charging_amps
      unit_of_measurement: "A"
      state_class: measurement
      state: >
        {% set set_amps = states('input_number.scylla_set_charging_amps') | float(27) %}
        {% set num = states('number.scylla_charging_amps') %}
        {% if states('sensor.scylla_charging_state') | lower in ['charging', 'starting'] and num | is_number %}
          {{ num | float(27) }}
        {% else %}
          {{ set_amps }}
        {% endif %}

    # Minutes to charge 1%.
    # Power reaching the battery (W) = volts × amps × phase factor × efficiency
    #                                  − fixed overhead
    #   • while charging: the car's live voltage (per phase) × number of phases
    #   • otherwise: the slow/fast voltage of the selected speed; 380 V and up
    #     means a 3-phase supply (Europe 400 V), so × √3 (1.732)
    #   • efficiency: input_number.scylla_charge_efficiency — the losses that
    #     grow with the power (charger, cable, battery heat), ~94%
    #   • overhead: input_number.scylla_charge_overhead_w — what the car itself
    #     uses while charging (~250 W). It is a fixed amount, so it costs a
    #     slow charge much more than a fast one: 120 V × 12 A ends up ~77%
    #     efficient, 240 V × 27 A ~90%, with the same two settings.
    # The scheduler uses the same formula (with the configured voltage).
    - name: "Scylla Charger 1 Percent Increase Time"
      unique_id: scylla_charger_1percent_increase_time
      unit_of_measurement: "min"
      state_class: measurement
      state: >
        {% set amps = states('sensor.scylla_charging_amps') | float(0) %}
        {% set capacity = states('input_number.scylla_battery_capacity_kwh') | float(75) %}
        {% set eff = states('input_number.scylla_charge_efficiency') | float(90) / 100 %}
        {% set overhead = states('input_number.scylla_charge_overhead_w') | float(0) %}
        {% set live_voltage = states('sensor.scylla_charger_voltage') | float(0) %}
        {% set charging = states('sensor.scylla_charging_state') | lower in ['charging', 'starting'] %}
        {% if charging and live_voltage > 75 %}
          {% set factor = states('sensor.scylla_charger_phases') | int(1) %}
          {% set voltage = live_voltage %}
        {% else %}
          {% if states('input_select.scylla_charging_speed') == 'Fast' %}
            {% set voltage = states('input_number.scylla_fast_voltage') | float(240) %}
          {% else %}
            {% set voltage = states('input_number.scylla_slow_voltage') | float(120) %}
          {% endif %}
          {% set factor = 1.732 if voltage >= 380 else 1 %}
        {% endif %}
        {% set watts = [voltage * amps * ([factor, 1] | max) * eff - overhead, 100] | max %}
        {% if amps > 0 and voltage > 0 %}
          {{ (capacity * 10 / watts * 60) | round(2) }}
        {% else %}
          unknown
        {% endif %}

    # The % the scheduler is really aiming for.
    #   1. The target % slider, after battery protection:
    #        50% → protection low cap (42%), 51% → protection mid cap (47%)
    #   2. The target range (km or mi), converted to the % it needs from the
    #      car's current range per % (range ÷ battery %), max 100%. The range
    #        is sensor.scylla_effective_range (estimated, or rated × factor).
    #   Target = the HIGHER of the two. The range is a minimum: it can raise
    #   the target, never lower it — 55% with a 30 km range stays 55%.
    # Attributes (read by the scheduler, the helper and the card):
    #   limit_target     the slider after protection (42 / 47 / the slider)
    #   range_pct        what the target range needs (0 = no range set)
    #   range_needed_pct same, not capped at 100 (to warn "not reachable")
    #   protection_only  true = no departure target, just keep the battery
    #                    in the protection band
    - name: "Scylla Charge Target Pct"
      unique_id: scylla_charge_target_pct
      unit_of_measurement: "%"
      state_class: measurement
      state: >
        {% set limit = states('input_number.scylla_set_charge_limit') | float(50) %}
        {% set low = states('input_number.scylla_protection_low') | float(42) %}
        {% set mid = states('input_number.scylla_protection_mid') | float(47) %}
        {% set protection = is_state('input_boolean.scylla_battery_protection_enabled', 'on') %}
        {% set limit_target = (low if limit <= 50 else mid) if (protection and limit <= 51) else limit %}
        {% set target_km = states('input_number.scylla_target_range_km') | float(0) %}
        {% set target_mi = states('input_number.scylla_target_range_mi') | float(0) %}
        {% set km = target_km > 0 %}
        {% set target_range = target_km if km else target_mi %}
        {% set current_range = states('sensor.scylla_effective_range' if km
                                      else 'sensor.scylla_effective_range_mi') | float(0) %}
        {% set pct = states('sensor.scylla_usable_battery_level_safe') | float(0) %}
        {% set range_pct = ([(target_range / (current_range / (pct / 100)) * 100) | round(0, 'ceil') | int, 100] | min)
                           if (target_range > 0 and pct > 0 and current_range > 0) else 0 %}
        {{ [limit_target, range_pct] | max | int }}
      attributes:
        limit_target: >
          {% set limit = states('input_number.scylla_set_charge_limit') | float(50) %}
          {% set low = states('input_number.scylla_protection_low') | float(42) %}
          {% set mid = states('input_number.scylla_protection_mid') | float(47) %}
          {% set protection = is_state('input_boolean.scylla_battery_protection_enabled', 'on') %}
          {% set limit_target = (low if limit <= 50 else mid) if (protection and limit <= 51) else limit %}
          {{ limit_target | int }}
        range_pct: >
          {% set target_km = states('input_number.scylla_target_range_km') | float(0) %}
          {% set target_mi = states('input_number.scylla_target_range_mi') | float(0) %}
          {% set km = target_km > 0 %}
          {% set target_range = target_km if km else target_mi %}
          {% set current_range = states('sensor.scylla_effective_range' if km
                                      else 'sensor.scylla_effective_range_mi') | float(0) %}
          {% set pct = states('sensor.scylla_usable_battery_level_safe') | float(0) %}
          {% set range_pct = ([(target_range / (current_range / (pct / 100)) * 100) | round(0, 'ceil') | int, 100] | min)
                           if (target_range > 0 and pct > 0 and current_range > 0) else 0 %}
          {{ range_pct }}
        range_needed_pct: >
          {% set target_km = states('input_number.scylla_target_range_km') | float(0) %}
          {% set target_mi = states('input_number.scylla_target_range_mi') | float(0) %}
          {% set km = target_km > 0 %}
          {% set target_range = target_km if km else target_mi %}
          {% set current_range = states('sensor.scylla_effective_range' if km
                                      else 'sensor.scylla_effective_range_mi') | float(0) %}
          {% set pct = states('sensor.scylla_usable_battery_level_safe') | float(0) %}
          {{ ((target_range / (current_range / (pct / 100)) * 100) | round(0, 'ceil') | int)
             if (target_range > 0 and pct > 0 and current_range > 0) else 0 }}
        protection_only: >
          {% set limit = states('input_number.scylla_set_charge_limit') | float(50) %}
          {% set low = states('input_number.scylla_protection_low') | float(42) %}
          {% set mid = states('input_number.scylla_protection_mid') | float(47) %}
          {% set protection = is_state('input_boolean.scylla_battery_protection_enabled', 'on') %}
          {% set limit_target = (low if limit <= 50 else mid) if (protection and limit <= 51) else limit %}
          {% set target_km = states('input_number.scylla_target_range_km') | float(0) %}
          {% set target_mi = states('input_number.scylla_target_range_mi') | float(0) %}
          {% set km = target_km > 0 %}
          {% set target_range = target_km if km else target_mi %}
          {% set current_range = states('sensor.scylla_effective_range' if km
                                      else 'sensor.scylla_effective_range_mi') | float(0) %}
          {% set pct = states('sensor.scylla_usable_battery_level_safe') | float(0) %}
          {% set range_pct = ([(target_range / (current_range / (pct / 100)) * 100) | round(0, 'ceil') | int, 100] | min)
                           if (target_range > 0 and pct > 0 and current_range > 0) else 0 %}
          {{ protection and limit <= 51 and range_pct <= limit_target }}

    # Estimated time to reach the target from the current %, using the
    # minutes-per-% sensor above (same formula as the scheduler).
    - name: "Scylla Charge Time"
      unique_id: scylla_charge_time
      state: >
        {% set current_pct = states('sensor.scylla_usable_battery_level_safe') | float(0) %}
        {% set target = states('sensor.scylla_charge_target_pct') | float(0) %}
        {% set min_per_pct = states('sensor.scylla_charger_1percent_increase_time') | float(0) %}
        {% set needed = [target - current_pct, 0] | max %}
        {% if needed <= 0 %}
          Already at target
        {% elif min_per_pct > 0 %}
          {% set total = (needed * min_per_pct) | round(0, 'ceil') | int %}
          {{ total // 60 }}h {{ total % 60 }}min
        {% else %}
          unknown
        {% endif %}

    # When the scheduler will start charging. It reads the plan the scheduler
    # stored in input_datetime.scylla_planned_charge_start, so the dashboard
    # always shows what will really happen (no separate calculation).
    #   "Charging"     the car is charging now
    #   "HH:MM"        planned start today
    #   "Sat 01:35"    planned start on another day
    #   "Not needed"   nothing planned (target reached, protection only, or
    #                  away from your charging locations)
    - name: "Scylla Charge Start At"
      unique_id: scylla_charge_start_at
      icon: mdi:clock-start
      state: >
        {% set plan = state_attr('input_datetime.scylla_planned_charge_start', 'timestamp') | float(0) %}
        {% if states('sensor.scylla_charging_state') | lower in ['charging', 'starting'] %}
          Charging
        {% elif plan > as_timestamp(now()) %}
          {% if plan | timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d') %}
            {{ plan | timestamp_custom('%H:%M') }}
          {% else %}
            {{ plan | timestamp_custom('%a %H:%M') }}
          {% endif %}
        {% else %}
          Not needed
        {% endif %}

    - name: Scylla Charging State UI
      unique_id: teslamate_1_charging_state_ui
      state: "{{ states('sensor.scylla_charging_state') }}"
      icon: >
        {% set s = states('sensor.scylla_charging_state') %}

        {% if s == 'Charging' %}
          mdi:battery-charging
        {% elif s == 'Disconnected' %}
          mdi:battery-off-outline
        {% elif s == 'Stopped' %}
          mdi:battery-alert-variant-outline
        {% elif s == 'NoPower' %}
          mdi:power-plug-off
        {% elif s == 'Complete' %}
          mdi:check-circle
        {% else %}
          mdi:battery
        {% endif %}

    # Car GPS location as "lat,lon" string for Waze Travel Time origin
    - name: "Scylla GPS Location"
      unique_id: scylla_gps_location
      state: >
        {{ state_attr('device_tracker.scylla_location', 'latitude') }},{{ state_attr('device_tracker.scylla_location', 'longitude') }}

   # Battery % needed to drive home + 33% buffer (only meaningful when away)
    - name: "Scylla Return Home Battery Pct"
      unique_id: scylla_return_home_battery_pct
      unit_of_measurement: "%"
      state: >
        {% set current_pct = states('sensor.scylla_usable_battery_level_safe') | float(0) %}
        {% set est_range = states('sensor.scylla_effective_range') | float(0) %}
        {% set distance = state_attr('sensor.waze_scylla_to_home', 'distance') | float(0) %}
        {% if current_pct > 0 and est_range > 0 and distance > 0
              and not is_state('device_tracker.scylla_location', 'home') %}
          {% set full_range = est_range / (current_pct / 100) %}
          {% set pct_needed = (distance / full_range * 100) + 33 %}
          {{ pct_needed | round(0) | int }}
        {% else %}
          0
        {% endif %}

    # Distance to home from Waze (km)
    - name: "Scylla Distance To Home"
      unique_id: scylla_distance_to_home
      unit_of_measurement: "km"
      state: >
        {% if not is_state('device_tracker.scylla_location', 'home') %}
          {{ state_attr('sensor.waze_scylla_to_home', 'distance') | float(0) | round(1) }}
        {% else %}
          0
        {% endif %}

    - name: "Scylla Climate Suggested Lead Minutes"
      unique_id: scylla_climate_suggested_lead_minutes
      icon: mdi:timer-outline
      unit_of_measurement: "min"
      state: >
        {% set outside = states('sensor.scylla_outside_temp') | float(15) %}
        {% set inside = states('sensor.scylla_inside_temp') | float(15) %}
        {# Resistive heating = slower warm-up than heat pump, longer lead times #}
        {% if inside <= -10 %}
          40
        {% elif inside <= 0 %}
          30
        {% elif inside <= 10 %}
          20
        {% elif inside <= 18 %}
          10
        {% elif outside >= 32 or inside >= 32 %}
          {# AC is fast, doesn't need much lead time #}
          10
        {% elif outside >= 25 %}
          8
        {% else %}
          5
        {% endif %}

    # Scylla climate target temperature based on GPS outdoor + car indoor temperatures
    - name: "Scylla Climate Suggested Target Temp"
      unique_id: scylla_climate_suggested_target_temp
      icon: mdi:thermometer
      unit_of_measurement: "°C"
      state: >
        {% set is_home = states('sensor.scylla_geofence') == 'Home' %}
        {% set is_offline = states('sensor.scylla_state') == 'offline' %}
        {% set gps_weather = states('sensor.scylla_location_weather_temp') | float(None) %}
        {% set sensor_outside = states('sensor.scylla_outside_temp') | float(15) %}
        {% if is_offline and not is_home and gps_weather is not none %}
          {% set outside = gps_weather %}
        {% else %}
          {% set outside = sensor_outside %}
        {% endif %}
        {% set inside = states('sensor.scylla_inside_temp') | float(15) %}
        {% set cold_ref = [outside, inside] | min %}
        {% set hot_ref = [outside, inside] | max %}
        {% if cold_ref <= -15 %}
          24
        {% elif cold_ref <= 0 %}
          23
        {% elif cold_ref <= 10 %}
          21
        {% elif hot_ref >= 32 %}
          19
        {% elif hot_ref >= 25 %}
          20
        {% else %}
          21
        {% endif %}
