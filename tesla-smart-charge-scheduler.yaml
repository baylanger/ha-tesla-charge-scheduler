# ═════════════════════════════════════════════════════════════════════════════
# Scylla - Smart Charge Scheduler
#
# Decides WHEN the car charges and up to WHAT level, at your charging
# locations (home, chalet, …). It never waits inside a run: the planned start
# is stored in input_datetime.scylla_planned_charge_start and a time trigger on
# that helper starts the charge. That makes the plan survive HA restarts and
# lets the dashboard show exactly what the automation will do.
#
# The actual "start the charge" steps live in script.scylla_start_charge
# (script.yaml), so a new trigger can never cancel a start halfway through.
#
# NOTE: the Home Assistant automation editor removes YAML comments when you
# save. Every step also has an `alias:` — those survive and show in traces.
# Keep this file as your documented reference copy.
# ═════════════════════════════════════════════════════════════════════════════
alias: Scylla - Smart Charge Scheduler
description: >
  Plans and starts charging at your charging locations: departure-based
  charging to the target %, battery protection for NMC/NCA (keep the battery
  between ~40% and 42% when the limit is 50%), reset to defaults when the car
  leaves a charging location, weekday/weekend departure defaults, voltage
  detection when plugged in. The start itself is done by script.scylla_start_charge.

# queued (not restart): runs are short and never wait for long, so each
# trigger is handled in order instead of cancelling the previous run.
mode: queued
max: 10

# ── Configuration ────────────────────────────────────────────────────────────
# Change these values to suit your car and habits. The helper automation has
# its own small variables block (notification_target, location amps) — keep
# notification_target equal in both.
variables:
  # Target % restored when the car leaves a charging location.
  # With battery protection on, 50 means "keep the battery around 40-42%".
  default_target_pct: 50
  # Departure defaults. At 18:00 the departure switches to the default for
  # the next day (only if it is still a default value, never a custom time).
  default_departure_time_weekday: '06:00:00'
  default_departure_time_weekend: '08:00:00'
  # Only a fallback for templates when the amps helper is unavailable. The real
  # default amps are per location, in the helper automation (location_amps).
  default_charging_amps: 27
  # true for NMC/NCA batteries, false for LFP (see README → Battery chemistry)
  enable_battery_protection: true
  # Protection caps: limit 50% → charge to 42%, limit 51% → charge to 47%
  protection_limit_low_pct: 42
  protection_limit_mid_pct: 47
  # Wake the car once a day (13:00) when it is plugged in at a charging
  # location and asleep, so its battery % is refreshed. A sleeping car does
  # not report battery drain, so protection could otherwise miss a drop.
  daily_wake_check: true
  # After the departure time has passed, go back to the defaults (target %,
  # target range, departure time) — but only once the car has REACHED its
  # target and is no longer charging, so a charge that needs a few more
  # minutes is never cut short. Speed and amps are not touched: they describe
  # the outlet the car is plugged into, which hasn't changed.
  # false = keep the trip settings until the car leaves a charging location.
  reset_after_departure: true
  # Notification when you plug in and a charge is planned: "Charging starts
  # at 01:38, ready for 06:00". With false you only hear about the plan when
  # it changes, or when the car started charging by itself and was stopped.
  remind_plan_on_plugin: true
  # Evening reminder (21:00) when the car is at a charging location, NOT
  # plugged in, and it needs a charge (a trip target not reached, or the
  # battery below the protection level). To change the time, edit the
  # `plug_reminder` trigger below.
  remind_if_not_plugged: true
  # Notify service for every notification (keep equal in the helper)
  notification_target: notify.notify
  # Set > 0 to force a voltage instead of the GPS/country detection
  voltage_override_slow: 0
  voltage_override_fast: 0

triggers:
  # ── Things you change → re-plan and tell you about the new plan ────────────
  # The 3-second "for" debounces sliders and lets the helper finish its own
  # update first (changing the speed also changes the amps).
  - trigger: state
    entity_id:
      - input_number.scylla_set_charge_limit
      - input_number.scylla_target_range_km
      - input_number.scylla_target_range_mi
      - input_datetime.scylla_departure_time
      - input_number.scylla_set_charging_amps
      - input_select.scylla_charging_speed
    for:
      seconds: 3
    id: replan_user

  # ── Things that change on their own → re-plan silently ─────────────────────
  - trigger: state
    entity_id: sensor.scylla_usable_battery_level
    not_to:
      - unknown
      - unavailable
    id: replan
  - trigger: state
    entity_id: binary_sensor.scylla_at_charging_location
    from: 'off'
    to: 'on'
    id: replan
  - trigger: time
    at: '00:01:00'
    id: replan
  - trigger: homeassistant
    event: start
    id: replan

  # ── Cable plugged in → detect voltage, then re-plan (with notification) ────
  - trigger: state
    entity_id: binary_sensor.scylla_charger
    from: 'off'
    to: 'on'
    id: plugged_in

  # ── Car started charging (on its own at plug-in, from the app, or by us) ───
  - trigger: state
    entity_id: sensor.scylla_charging_state
    to: Charging
    id: charging_started

  # ── The planned start time has come ────────────────────────────────────────
  - trigger: time
    at: input_datetime.scylla_planned_charge_start
    id: planned_start

  # ── Cable unplugged → forget a pending protection-run flag ─────────────────
  - trigger: state
    entity_id: binary_sensor.scylla_charger
    from: 'on'
    to: 'off'
    id: unplugged

  # ── Car left a charging location (the sensor waits 3 min before turning
  #    off, so GPS jitter or a TeslaMate restart does not reset anything) ─────
  - trigger: state
    entity_id: binary_sensor.scylla_at_charging_location
    from: 'on'
    to: 'off'
    id: left_location

  # ── The departure time has come (every day at that time, whether or not
  #    you leave) → once the target is reached, reset to the defaults ─────────
  - trigger: time
    at: input_datetime.scylla_departure_time
    id: departure_passed
  # A charge ended (target reached, stopped, unplugged…) → the car may now be
  # at its target after the departure time, which is when the reset happens
  - trigger: state
    entity_id: sensor.scylla_charging_state
    from: Charging
    not_to:
      - unknown
      - unavailable
    id: charge_ended

  # ── Evening reminder if the car isn't plugged in (see remind_if_not_plugged)
  - trigger: time
    at: '21:00:00'
    id: plug_reminder

  # ── Daily housekeeping ─────────────────────────────────────────────────────
  - trigger: time
    at: '18:00:00'
    id: update_departure
  - trigger: time
    at: '13:00:00'
    id: wake_check

conditions: []

actions:
  # ───────────────────────────────────────────────────────────────────────────
  # Step 1 — Plugged in: look up the country from GPS and set the slow/fast
  # voltages used by every charge-time calculation. Then fall through to the
  # planning below (plugged_in is also a planning trigger).
  # ───────────────────────────────────────────────────────────────────────────
  - alias: Plugged in → detect country voltages
    if:
      - condition: trigger
        id: plugged_in
    then:
      - alias: Refresh the country-code REST sensor
        action: homeassistant.update_entity
        target:
          entity_id: sensor.scylla_location_country_code
        continue_on_error: true
      - alias: Wait up to 10 s for the new country code
        wait_for_trigger:
          - trigger: state
            entity_id: sensor.scylla_location_country_code
        timeout: '00:00:10'
        continue_on_timeout: true
      - variables:
          country_code: "{{ states('sensor.scylla_location_country_code') | upper }}"
          # sensor.ev_voltage_map holds "slow,fast" per country (template.yaml).
          # The split happens INSIDE this template and gives a list
          # [slow, fast]: a variable that renders as "120,240" is turned into
          # a tuple by Home Assistant, and .split() then fails (that silently
          # broke voltage detection in the previous version).
          country_voltages: >
            {% set map = state_attr('sensor.ev_voltage_map', 'map') %}
            {% set entry = (map.get(country_code, '120,240') if map else '120,240') | string %}
            {{ entry.split(',') | map('float', 0) | list }}
          final_slow: >
            {{ voltage_override_slow if voltage_override_slow > 0
               else (country_voltages[0] if country_voltages[0] > 0 else 120) }}
          final_fast: >
            {{ voltage_override_fast if voltage_override_fast > 0
               else (country_voltages[1] if country_voltages[1] > 0 else 240) }}
      # Kept inside each helper's min/max (slow 100-120 V, fast 200-400 V):
      # a value outside the range would make set_value fail and stop the run.
      # In a 230 V country the "slow" outlet is 230 V and is stored as 120 V,
      # so use the Fast speed there.
      - alias: Store slow voltage
        action: input_number.set_value
        target:
          entity_id: input_number.scylla_slow_voltage
        data:
          value: >
            {{ [[final_slow, state_attr('input_number.scylla_slow_voltage', 'min') | float(100)] | max,
                state_attr('input_number.scylla_slow_voltage', 'max') | float(120)] | min }}
      - alias: Store fast voltage
        action: input_number.set_value
        target:
          entity_id: input_number.scylla_fast_voltage
        data:
          value: >
            {{ [[final_fast, state_attr('input_number.scylla_fast_voltage', 'min') | float(200)] | max,
                state_attr('input_number.scylla_fast_voltage', 'max') | float(400)] | min }}

  # ───────────────────────────────────────────────────────────────────────────
  # Step 2 — After the departure time: go back to the defaults, but only once
  # the target is reached.
  #
  # Example: you set 80% for a 06:00 departure and then stay home. At 06:00 the
  # flag "departure passed" is turned on. If the car is still charging (maybe
  # 5-10 minutes short of 80%) nothing happens; when the charge ends, or the
  # battery % is updated, the target is reached and the settings reset to the
  # defaults (50% = battery protection only), so the car doesn't keep topping
  # up to 80% every night.
  # The flag is cleared when you set a new target, range or departure time
  # (a new trip), when the car leaves, and after the reset.
  # ───────────────────────────────────────────────────────────────────────────
  - alias: After departure → reset to the defaults once the target is reached
    if:
      - condition: template
        value_template: >
          {{ reset_after_departure
             and trigger.id in ['departure_passed', 'charge_ended', 'replan']
             and is_state('binary_sensor.scylla_at_charging_location', 'on') }}
    then:
      - alias: The departure time has passed → remember it
        if:
          - condition: trigger
            id: departure_passed
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.scylla_departure_passed
      - alias: Work out whether a reset is due
        variables:
          pending: "{{ is_state('input_boolean.scylla_departure_passed', 'on') }}"
          still_charging: "{{ states('sensor.scylla_charging_state') | lower in ['charging', 'starting'] }}"
          # Target reached: the battery is at or above sensor.scylla_charge_target_pct
          # (the target % or what the target range needs, 42% for protection only)
          target_reached: >
            {{ states('sensor.scylla_usable_battery_level_safe') | float(0)
               >= states('sensor.scylla_charge_target_pct') | float(100) }}
          next_default_departure: >
            {% if (now() + timedelta(hours=20)).weekday() >= 5 %}
              {{ default_departure_time_weekend }}
            {% else %}
              {{ default_departure_time_weekday }}
            {% endif %}
          # Is there anything to reset? (If everything is already at the
          # defaults the flag is just cleared and nothing is written.)
          something_to_reset: >
            {{ states('input_number.scylla_set_charge_limit') | int(default_target_pct) != default_target_pct
               or states('input_number.scylla_target_range_km') | float(0) > 0
               or states('input_number.scylla_target_range_mi') | float(0) > 0
               or states('input_datetime.scylla_departure_time') != next_default_departure | trim }}
      - choose:
          - alias: Nothing to reset → just drop the flag
            conditions:
              - condition: template
                value_template: "{{ pending and not something_to_reset }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.scylla_departure_passed
          - alias: Target reached, not charging → reset to the defaults
            conditions:
              - condition: template
                value_template: "{{ pending and something_to_reset and target_reached and not still_charging }}"
            sequence:
              - alias: Target % back to the default (HA side)
                action: input_number.set_value
                target:
                  entity_id: input_number.scylla_set_charge_limit
                data:
                  value: "{{ default_target_pct }}"
              # The car's own limit follows (minimum 50%). Done after the
              # line above, so the helper recognises it as HA's own value and
              # doesn't copy it back.
              - alias: Charge limit on the car back to the default (minimum 50%)
                if:
                  - condition: template
                    value_template: >
                      {{ states('sensor.scylla_charge_limit_soc') | int(0) != [default_target_pct, 50] | max }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.scylla_charge_limit
                    data:
                      value: "{{ [default_target_pct, 50] | max }}"
                    continue_on_error: true
              - alias: Departure back to the default for the next departure day
                action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.scylla_departure_time
                data:
                  time: "{{ next_default_departure | trim }}"
              - alias: Clear the target range (km)
                action: input_number.set_value
                target:
                  entity_id: input_number.scylla_target_range_km
                data:
                  value: 0
              - alias: Clear the target range (mi)
                action: input_number.set_value
                target:
                  entity_id: input_number.scylla_target_range_mi
                data:
                  value: 0
              - alias: Clear the planned start
                action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.scylla_planned_charge_start
                data:
                  datetime: '2000-01-01 00:00:00'
              - alias: Clear the "departure passed" flag
                action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.scylla_departure_passed

  # ───────────────────────────────────────────────────────────────────────────
  # Step 3 — One branch per kind of trigger.
  # ───────────────────────────────────────────────────────────────────────────
  - choose:
      # ═════════════════════════════════════════════════════════════════════
      # Left a charging location → reset everything to the defaults.
      # ═════════════════════════════════════════════════════════════════════
      - alias: Left a charging location → reset to defaults
        conditions:
          - condition: trigger
            id: left_location
        sequence:
          - alias: Target % back to the default (HA side)
            action: input_number.set_value
            target:
              entity_id: input_number.scylla_set_charge_limit
            data:
              value: "{{ default_target_pct }}"
          - alias: Charge limit on the car back to the default (minimum 50%)
            action: number.set_value
            target:
              entity_id: number.scylla_charge_limit
            data:
              value: "{{ [default_target_pct, 50] | max }}"
            continue_on_error: true
          - alias: Departure back to the default for the next departure day
            action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.scylla_departure_time
            data:
              # now + 20 h lands on the day of the next departure: leaving at
              # 07:00 Mon → Tue; at 00:30 Sat → Sat; at 18:00 Fri → Sat.
              time: >
                {% if (now() + timedelta(hours=20)).weekday() >= 5 %}
                  {{ default_departure_time_weekend }}
                {% else %}
                  {{ default_departure_time_weekday }}
                {% endif %}
          - alias: Clear the target range (km)
            action: input_number.set_value
            target:
              entity_id: input_number.scylla_target_range_km
            data:
              value: 0
          - alias: Clear the target range (mi)
            action: input_number.set_value
            target:
              entity_id: input_number.scylla_target_range_mi
            data:
              value: 0
          - alias: Charging speed back to Fast
            action: input_select.select_option
            target:
              entity_id: input_select.scylla_charging_speed
            data:
              option: Fast
          - alias: Clear the protection-run flag
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.scylla_protection_charge_active
          - alias: Clear the "departure passed" flag
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.scylla_departure_passed
          - alias: Clear the planned start
            action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.scylla_planned_charge_start
            data:
              datetime: '2000-01-01 00:00:00'
          # Amps are NOT reset here: when the car arrives at a charging
          # location the helper sets that location's default amps.

      # ═════════════════════════════════════════════════════════════════════
      # Unplugged → a protection run can't continue; drop its flag.
      # ═════════════════════════════════════════════════════════════════════
      - alias: Unplugged → clear the protection-run flag
        conditions:
          - condition: trigger
            id: unplugged
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.scylla_protection_charge_active

      # ═════════════════════════════════════════════════════════════════════
      # 18:00 → switch the departure to the next day's default, but only if
      # it is still one of the two defaults. A custom time you set is never
      # touched (leaving a charging location resets it anyway).
      # ═════════════════════════════════════════════════════════════════════
      - alias: 18:00 → next day's default departure
        conditions:
          - condition: trigger
            id: update_departure
        sequence:
          - variables:
              current_departure: "{{ states('input_datetime.scylla_departure_time') }}"
              wanted_departure: >
                {% if (now() + timedelta(hours=20)).weekday() >= 5 %}
                  {{ default_departure_time_weekend }}
                {% else %}
                  {{ default_departure_time_weekday }}
                {% endif %}
          - alias: Only replace a default value
            condition: template
            value_template: >
              {{ current_departure in [default_departure_time_weekday,
                                       default_departure_time_weekend]
                 and current_departure != wanted_departure }}
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.scylla_departure_time
            data:
              time: "{{ wanted_departure }}"

      # ═════════════════════════════════════════════════════════════════════
      # 13:00 → wake a sleeping car that is plugged in at a charging location,
      # so TeslaMate gets a fresh battery %. Once a day only.
      # ═════════════════════════════════════════════════════════════════════
      - alias: 13:00 → daily wake check
        conditions:
          - condition: trigger
            id: wake_check
          - condition: template
            value_template: >
              {{ daily_wake_check
                 and is_state('binary_sensor.scylla_at_charging_location', 'on')
                 and is_state('binary_sensor.scylla_charger', 'on')
                 and states('sensor.scylla_state') in ['asleep', 'offline', 'suspended'] }}
        sequence:
          - action: button.press
            target:
              entity_id: button.scylla_wake_up
            continue_on_error: true

    # ═══════════════════════════════════════════════════════════════════════
    # Everything else (replan_user, replan, plugged_in, charging_started,
    # planned_start, departure_passed, charge_ended, plug_reminder) → compute
    # the plan and act on it.
    # ═══════════════════════════════════════════════════════════════════════
    default:
      # A new target, range or departure time is a new trip: forget that the
      # previous departure has passed, otherwise the reset would fire as soon
      # as the new target is reached — before the new departure.
      - alias: New trip setting → forget "departure passed"
        if:
          - condition: template
            value_template: >
              {{ trigger.id == 'replan_user'
                 and trigger.entity_id in ['input_number.scylla_set_charge_limit',
                                           'input_number.scylla_target_range_km',
                                           'input_number.scylla_target_range_mi',
                                           'input_datetime.scylla_departure_time'] }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.scylla_departure_passed

      # Keep the helpers that other automations, templates and the dashboard
      # read in sync with the configuration above.
      - alias: Publish the protection caps
        action: input_number.set_value
        target:
          entity_id: input_number.scylla_protection_low
        data:
          value: "{{ protection_limit_low_pct }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.scylla_protection_mid
        data:
          value: "{{ protection_limit_mid_pct }}"
      - alias: Publish the battery-protection on/off setting
        action: "input_boolean.turn_{{ 'on' if enable_battery_protection else 'off' }}"
        target:
          entity_id: input_boolean.scylla_battery_protection_enabled

      # ── Gather the facts ────────────────────────────────────────────────
      - alias: Compute the plan
        variables:
          at_location: "{{ is_state('binary_sensor.scylla_at_charging_location', 'on') }}"
          plugged: "{{ is_state('binary_sensor.scylla_charger', 'on') }}"
          # Only TeslaMate's charging_state is trusted: binary_sensor.scylla_charging
          # can stay "on" long after a charge has stopped.
          charging: "{{ states('sensor.scylla_charging_state') | lower in ['charging', 'starting'] }}"
          # A charge that starts within 5 minutes of plugging in was started
          # by the car itself, not by you in the app.
          # TeslaMate publishes "cable connected" and "Charging" as separate
          # messages and I can't rely on their order, so this works both ways:
          #   • cable first, then Charging  → the charging_started run sees it
          #   • Charging first, then cable  → the plugged_in run sees it
          #     (and in the charging_started run the cable still reads "off",
          #     which counts as "just plugged in" — plug_age 0)
          # A Charging state that appears out of unknown/unavailable (HA or
          # TeslaMate restart) is a car that was already charging: not "self".
          plug_age: >
            {{ (as_timestamp(now())
                - as_timestamp(states.binary_sensor.scylla_charger.last_changed)) if plugged else 0 }}
          self_started: >
            {{ charging and plug_age < 300
               and ((trigger.id == 'charging_started'
                     and trigger.from_state is not none
                     and trigger.from_state.state not in ['unknown', 'unavailable'])
                    or trigger.id == 'plugged_in') }}
          flag_on: "{{ is_state('input_boolean.scylla_protection_charge_active', 'on') }}"
          # Battery %: live value, or the last known value while the car sleeps
          pct: "{{ states('sensor.scylla_usable_battery_level_safe') | float(0) }}"

          # Target % slider
          requested: "{{ states('input_number.scylla_set_charge_limit') | int(default_target_pct) }}"
          # What the slider means after protection: 50 → 42%, 51 → 47%
          limit_cap: >
            {{ protection_limit_mid_pct if requested == 51 else protection_limit_low_pct }}
          limit_target: >
            {{ limit_cap if (enable_battery_protection and requested <= 51) else requested }}
          # Target range (km/mi) converted to the % it needs. The range is a
          # MINIMUM: it can raise the target above the slider, never lower it.
          # (55% with a 30 km range stays 55%.) The conversion is done once,
          # in sensor.scylla_charge_target_pct (template.yaml).
          range_pct: "{{ state_attr('sensor.scylla_charge_target_pct', 'range_pct') | int(0) }}"

          # Protection only: slider at 50% or 51% with protection on, and no
          # target range above the cap. The battery is just kept inside a safe
          # band, there is no departure target.
          protection_only: >
            {{ enable_battery_protection and requested <= 51 and range_pct <= limit_target }}
          # The protection cap: 47% for a 51% slider, otherwise 42%
          cap: "{{ limit_cap if protection_only else protection_limit_low_pct }}"
          target: "{{ [limit_target, range_pct] | max }}"
          # Protection charges only start below cap − hysteresis (default
          # 42 − 2 = 40%). The car's reading settles ~1% lower after a charge,
          # so without this gap 42% → 41% would restart charging every time.
          resume_below: "{{ cap - states('input_number.scylla_protection_hysteresis') | float(2) }}"
          below_resume: "{{ enable_battery_protection and pct < resume_below }}"
          need_pct: "{{ [target - pct, 0] | max }}"
          # Does the car need a charge before the next departure? (for the
          # evening reminder) Protection only: only below the resume level.
          charge_needed: >
            {{ (protection_only and below_resume) or (not protection_only and need_pct > 0) }}

          # ── Charge duration ──
          # Uses the planned amps and the voltage of the selected speed, an
          # efficiency factor (charging losses) and 3-phase power above 380 V.
          amps: "{{ states('input_number.scylla_set_charging_amps') | float(default_charging_amps) }}"
          voltage: >
            {% if states('input_select.scylla_charging_speed') == 'Fast' %}
              {{ voltage_override_fast if voltage_override_fast > 0
                 else states('input_number.scylla_fast_voltage') | float(240) }}
            {% else %}
              {{ voltage_override_slow if voltage_override_slow > 0
                 else states('input_number.scylla_slow_voltage') | float(120) }}
            {% endif %}
          # Power that reaches the battery (W):
          #   volts × amps × phase factor × efficiency − fixed overhead
          # The efficiency covers the losses that grow with the power (charger,
          # cable, battery heat). The overhead is what the car itself uses
          # while it charges (computer, pumps, cooling), a few hundred watts
          # that don't depend on the speed. It matters little at 6-11 kW and a
          # lot at 1.4 kW: that is why a 120 V charge is only ~75-80%
          # efficient and a 240 V charge ~90%, with the same two settings.
          # Overhead 0 = the old behaviour (efficiency alone).
          efficiency: "{{ states('input_number.scylla_charge_efficiency') | float(90) / 100 }}"
          overhead_w: "{{ states('input_number.scylla_charge_overhead_w') | float(0) }}"
          power_w: >
            {{ [voltage * amps * (1.732 if voltage >= 380 else 1) * efficiency - overhead_w, 100] | max }}
          # Minutes per 1%: capacity (kWh) × 10 = Wh per %, ÷ W = hours, × 60
          min_per_pct: >
            {{ states('input_number.scylla_battery_capacity_kwh') | float(75) * 10 / power_w * 60 }}
          minutes_needed: "{{ (need_pct * min_per_pct) | round(0, 'ceil') | int }}"
          protection_minutes: "{{ (([cap - pct, 0] | max) * min_per_pct) | round(0, 'ceil') | int }}"

          # ── Times (real date-times, so midnight and DST are handled) ──
          now_ts: "{{ as_timestamp(now()) }}"
          # Next departure: today at the departure time if still ahead, else tomorrow
          departure_ts: >
            {% set t = states('input_datetime.scylla_departure_time') %}
            {% set dep = today_at(t if has_value('input_datetime.scylla_departure_time')
                                  else default_departure_time_weekday) %}
            {% if dep <= now() %}{% set dep = dep + timedelta(days=1) %}{% endif %}
            {{ as_timestamp(dep) }}
          # Start so the charge ends at the departure time
          start_ts: "{{ departure_ts - minutes_needed * 60 }}"
          # Start now if the start time is (almost) here, or this is the
          # planned-start trigger itself.
          start_due: "{{ trigger.id == 'planned_start' or start_ts <= now_ts + 120 }}"
          old_plan_ts: "{{ state_attr('input_datetime.scylla_planned_charge_start', 'timestamp') | float(0) }}"

          # ── The decision ──
          # Every protection charge runs with the protection-run flag ON, so
          # the helper stops it at the cap even if you raise the target in
          # the middle of it (the raised target then gets its own plan).
          # start_protection_only  charge now to the protection cap (protection only)
          # start_protection       charge now to the cap, the full charge comes later
          # mark_protection        car started itself below the cap: let it run to the cap
          # keep_protection        a protection run is going; the full charge comes later
          # start_full             charge now to the target
          # continue_full          already charging: keep going to the target
          # stop_and_wait          car started itself but the plan says later: stop it
          # wait                   nothing now, plan the start for later
          # not_plugged            should start now but the cable is not connected
          # idle                   nothing to do
          decision: >
            {% if protection_only %}
              {% if not charging %}
                {{ 'start_protection_only' if (plugged and below_resume) else 'idle' }}
              {% elif self_started and not flag_on and pct < cap %}
                mark_protection
              {% else %}
                idle
              {% endif %}
            {% elif need_pct <= 0 %}
              idle
            {% elif charging %}
              {% if flag_on %}
                {{ 'continue_full' if (start_due or start_ts <= now_ts + protection_minutes * 60)
                   else 'keep_protection' }}
              {% elif self_started and not start_due %}
                {{ 'mark_protection' if (enable_battery_protection and pct < protection_limit_low_pct)
                   else 'stop_and_wait' }}
              {% else %}
                continue_full
              {% endif %}
            {% elif start_due %}
              {{ 'start_full' if plugged else 'not_plugged' }}
            {% elif below_resume and plugged %}
              {{ 'start_full' if start_ts <= now_ts + protection_minutes * 60 else 'start_protection' }}
            {% else %}
              wait
            {% endif %}

          # The plan to store (0 = no plan). Protection-only never has a plan:
          # it charges whenever the battery needs it.
          new_plan_ts: >
            {{ start_ts if (not protection_only
                            and decision in ['wait', 'keep_protection', 'mark_protection',
                                             'start_protection', 'stop_and_wait']) else 0 }}
          plan_changed: >
            {{ ((new_plan_ts - old_plan_ts) | abs >= 60) if new_plan_ts > 0
               else old_plan_ts > now_ts }}
          # Tell you about a plan when:
          #   • you changed a setting (target, departure, amps, speed) and the
          #     plan changed, or
          #   • you plugged in and a charge is planned (always with
          #     remind_plan_on_plugin, otherwise only if the plan changed).
          # Battery drift re-plans silently.
          notify_plan: >
            {{ new_plan_ts > 0 and
               ((trigger.id == 'replan_user' and plan_changed)
                or (trigger.id == 'plugged_in' and (remind_plan_on_plugin or plan_changed))) }}
          # "Plugged in, charging will start at …" after stopping a charge the
          # car started by itself: only if no plan message goes out already
          stop_notify: "{{ not notify_plan and not remind_plan_on_plugin }}"
          # For messages
          duration_text: "{{ minutes_needed // 60 }}h{{ '%02d' | format(minutes_needed % 60) }}"

      # ── Not at a charging location → no plan, nothing else ──────────────
      - alias: Away from charging locations → clear the plan and stop
        if:
          - condition: template
            value_template: "{{ not at_location }}"
        then:
          - if:
              - condition: template
                value_template: "{{ old_plan_ts > now_ts }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.scylla_planned_charge_start
                data:
                  datetime: '2000-01-01 00:00:00'
          - if:
              - condition: template
                value_template: "{{ flag_on }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.scylla_protection_charge_active
          - stop: Not at a charging location

      - alias: No battery reading yet → stop
        if:
          - condition: template
            value_template: "{{ pct <= 0 }}"
        then:
          - stop: No valid battery % yet

      # ── Evening reminder: not plugged in but a charge is needed ──────────
      # (trigger plug_reminder at 21:00, enabled by remind_if_not_plugged)
      - alias: Evening reminder → not plugged in
        if:
          - condition: template
            value_template: >
              {{ trigger.id == 'plug_reminder' and remind_if_not_plugged
                 and not plugged and charge_needed }}
        then:
          - action: "{{ notification_target }}"
            data:
              message: >
                {% if protection_only %}
                🔌 Scylla isn't plugged in and the battery is at {{ pct | int }}%,
                below the {{ resume_below | int }}% protection level. Plug it in
                so it can charge to {{ cap | int }}%.
                {% else %}
                🔌 Scylla isn't plugged in. The battery is at {{ pct | int }}% and
                needs ~{{ duration_text }} of charging to reach {{ target | int }}% for
                {{ departure_ts | timestamp_custom('%a %H:%M') }}. Plug it in tonight.
                {% endif %}

      # ── Act on the decision ─────────────────────────────────────────────
      - choose:
          - alias: Start a protection charge (protection only)
            conditions:
              - condition: template
                value_template: "{{ decision == 'start_protection_only' }}"
            sequence:
              # The car's limit becomes 50% (it refuses less); the helper
              # stops the charge at the cap (42% or 47%).
              - action: script.turn_on
                target:
                  entity_id: script.scylla_start_charge
                data:
                  variables:
                    target_pct: "{{ cap }}"
                    protection_run: true

          - alias: Start a protection charge now, full charge later
            conditions:
              - condition: template
                value_template: "{{ decision == 'start_protection' }}"
            sequence:
              # The script turns the flag on and sets the car's limit to 50%;
              # the helper stops the charge at the cap; the planned start
              # (stored below) then charges to the target.
              - action: script.turn_on
                target:
                  entity_id: script.scylla_start_charge
                data:
                  variables:
                    target_pct: "{{ cap }}"
                    protection_run: true

          - alias: The car started itself below the cap → treat it as a protection run
            conditions:
              - condition: template
                value_template: "{{ decision == 'mark_protection' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.scylla_protection_charge_active

          - alias: Start charging to the target now
            conditions:
              - condition: template
                value_template: "{{ decision == 'start_full' }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.scylla_start_charge
                data:
                  variables:
                    target_pct: "{{ target }}"
                    protection_run: false

          - alias: Already charging → keep going to the target
            conditions:
              - condition: template
                value_template: "{{ decision == 'continue_full' }}"
            sequence:
              # If a protection run was going, it now becomes the full charge.
              - if:
                  - condition: template
                    value_template: "{{ flag_on }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.scylla_protection_charge_active
              # Make sure the car's own limit lets it reach the target.
              - if:
                  - condition: template
                    value_template: >
                      {{ states('sensor.scylla_charge_limit_soc') | int(0) != [target | int, 50] | max }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.scylla_charge_limit
                    data:
                      value: "{{ [target | int, 50] | max }}"
                    continue_on_error: true

          - alias: The car started itself but the plan says later → stop it
            conditions:
              - condition: template
                value_template: "{{ decision == 'stop_and_wait' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.scylla_charger
                continue_on_error: true
              # With remind_plan_on_plugin the plug-in notification below
              # already says this, so this one is only for when it is off.
              - if:
                  - condition: template
                    value_template: "{{ stop_notify }}"
                then:
                  - action: "{{ notification_target }}"
                    data:
                      message: >
                        🔌 Scylla plugged in at {{ pct | int }}%. Charging will start at
                        {{ start_ts | timestamp_custom('%a %H:%M') }} to reach
                        {{ target | int }}% by {{ departure_ts | timestamp_custom('%a %H:%M') }}.

          - alias: Should start now but the cable is not connected
            conditions:
              - condition: template
                value_template: "{{ decision == 'not_plugged' }}"
            sequence:
              # Only remind you when the planned time actually came; otherwise
              # plugging in will start the charge right away.
              - if:
                  - condition: trigger
                    id: planned_start
                then:
                  - action: "{{ notification_target }}"
                    data:
                      message: >
                        ⚠️ Scylla isn't plugged in — the charge to {{ target | int }}%
                        planned for now couldn't start. It will start as soon as you plug in.

          - alias: Nothing to do now → clear a stale protection flag
            conditions:
              - condition: template
                value_template: "{{ decision == 'idle' and flag_on and not charging }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.scylla_protection_charge_active

      # ── Store the plan (or clear it) ────────────────────────────────────
      - alias: Store or clear the planned start
        if:
          - condition: template
            value_template: "{{ plan_changed }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.scylla_planned_charge_start
            data:
              # 2000-01-01 00:00 means "no plan" (it never fires)
              datetime: >
                {{ (new_plan_ts | timestamp_custom('%Y-%m-%d %H:%M:%S'))
                   if new_plan_ts > 0 else '2000-01-01 00:00:00' }}

      # ── Tell you about the plan (only when you caused it) ───────────────
      - alias: Notify the plan
        if:
          - condition: template
            value_template: "{{ notify_plan }}"
        then:
          - action: "{{ notification_target }}"
            data:
              message: >
                {% if trigger.id == 'plugged_in' %}
                🔌 Scylla plugged in at {{ pct | int }}%.
                {{ ('Battery protection is charging it to ' ~ (cap | int) ~ '% now; the charge to')
                   if decision == 'start_protection' else 'Charging to' }}
                {{ target | int }}% starts at {{ start_ts | timestamp_custom('%a %H:%M') }},
                ready for {{ departure_ts | timestamp_custom('%a %H:%M') }}
                (~{{ duration_text }} at {{ voltage | int }} V · {{ amps | int }} A).
                {% else %}
                📅 Scylla: charging planned at {{ start_ts | timestamp_custom('%a %H:%M') }},
                {{ pct | int }}% → {{ target | int }}% by
                {{ departure_ts | timestamp_custom('%a %H:%M') }}
                (~{{ duration_text }} at {{ voltage | int }} V · {{ amps | int }} A).
                {% if decision == 'start_protection' %}
                Battery protection charges to {{ cap | int }}% first, starting now.
                {% endif %}
                {% endif %}
