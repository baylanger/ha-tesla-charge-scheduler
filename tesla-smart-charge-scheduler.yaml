alias: Scylla - Smart Charge Scheduler
description: >
  Schedules Tesla charging based on current battery %, target %, and departure
  time. Handles voltage detection, battery protection, and post-charge reset.
triggers:
  - entity_id: number.scylla_charge_limit
    id: schedule
    trigger: state
  - entity_id: input_datetime.scylla_departure_time
    id: schedule
    trigger: state
  - entity_id: number.scylla_charging_amps
    id: schedule
    trigger: state
  - entity_id: input_number.scylla_set_charge_limit
    id: schedule
    trigger: state
  - at: '00:01:00'
    id: schedule
    trigger: time
  - at: '18:00:00'
    id: update_departure
    trigger: time
  - entity_id: sensor.scylla_usable_battery_level
    id: schedule
    trigger: state
  - entity_id: device_tracker.scylla_location
    from: home
    id: reset
    trigger: state
  - entity_id: binary_sensor.scylla_charger
    to: 'on'
    id: plugged_in
    trigger: state
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: update_departure
          - condition: template
            value_template: |
              {{ states('input_number.scylla_target_range_km') | float(0) == 0
                 and states('input_number.scylla_target_range_mi') | float(0) == 0
                 and states('sensor.scylla_charging_state') | lower != 'charging'
                 and not is_state('binary_sensor.scylla_charging', 'on') }}
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.scylla_departure_time
            data:
              time: |
                {% set tomorrow = now().weekday() + 1 %} {% if tomorrow >= 5 %}
                  {{ default_departure_time_weekend }}
                {% else %}
                  {{ default_departure_time_weekday }}
                {% endif %}
      - conditions:
          - condition: trigger
            id: plugged_in
        sequence:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.scylla_location_country_code
          - wait_for_trigger:
              - entity_id: sensor.scylla_location_country_code
                trigger: state
            timeout: '00:00:10'
            continue_on_timeout: true
          - variables:
              country_code: |
                {{ states('sensor.scylla_location_country_code') | upper }}
              voltage_entry: >
                {% set map = state_attr('sensor.ev_voltage_map', 'map') %} {{
                map.get(country_code, '120,240') if map else '120,240' }}
              mapped_slow: |
                {{ voltage_entry.split(',')[0] | float(120) }}
              mapped_fast: |
                {{ voltage_entry.split(',')[1] | float(240) }}
              final_slow: >
                {{ voltage_override_slow if voltage_override_slow > 0 else
                mapped_slow }}
              final_fast: >
                {{ voltage_override_fast if voltage_override_fast > 0 else
                mapped_fast }}
          - action: input_number.set_value
            target:
              entity_id: input_number.scylla_slow_voltage
            data:
              value: '{{ final_slow }}'
          - action: input_number.set_value
            target:
              entity_id: input_number.scylla_fast_voltage
            data:
              value: '{{ final_fast }}'
          - choose:
              - conditions:
                  - condition: template
                    value_template: |
                      {{ is_state('binary_sensor.scylla_charger', 'off') }}
                sequence:
                  - action: '{{ notification_target }}'
