## DASHBOARD CARD — MI VERSION
## Paste this as a Manual card in your HA dashboard

type: vertical-stack
cards:
  # ── Charger status badge ─────────────────────────────────────────────────
  # A protection charge is either a protection-only target (50% → 42%,
  # 51% → 47%, no target range above it) or a protection run (flag on).
  - type: markdown
    content: >
      {% set charging_state = states('sensor.scylla_charging_state') | lower %}
      {% set is_connected = is_state('binary_sensor.scylla_plugged_in', 'on') %}
      {% set is_charging = charging_state in ['charging', 'starting'] %}
      {% set protection_only = state_attr('sensor.scylla_charge_target_pct', 'protection_only') | default(false, true) %}
      {% set protection_on = is_state('input_boolean.scylla_battery_protection_enabled', 'on') %}
      {% set protection_run = is_state('input_boolean.scylla_protection_charge_active', 'on') %}
      {% set at_location = is_state('binary_sensor.scylla_at_charging_location', 'on') %}
      {% if not is_connected or charging_state == 'disconnected' %}
      <ha-alert alert-type="error">🔴 Not connected to charger</ha-alert>
      {% elif is_charging and at_location and protection_on and (protection_run or protection_only) %}
      <ha-alert alert-type="warning">🔋 Charging for battery protection</ha-alert>
      {% elif is_charging %}
      <ha-alert alert-type="success">🟢 Charging</ha-alert>
      {% elif charging_state == 'complete' %}
      <ha-alert alert-type="success">✅ Charge complete</ha-alert>
      {% else %}
      <ha-alert alert-type="warning">🟡 Connected — not charging ({{ charging_state | title }})</ha-alert>
      {% endif %}

  # ── Main entities ────────────────────────────────────────────────────────
  - type: entities
    title: Tesla Charge Schedule
    entities:
      # "Charging", a planned time, or "Not needed" (read from the scheduler's plan)
      - entity: sensor.scylla_charge_start_at
        name: Start at
        icon: mdi:clock-start
      - entity: sensor.scylla_charge_time
        name: Charge time
        icon: mdi:timer-outline
      - entity: input_datetime.scylla_departure_time
        name: Departure time
      - entity: sensor.scylla_usable_battery_level
        name: Current battery %
      - entity: sensor.scylla_charge_target_pct
        name: Target battery %
      - entity: input_number.scylla_set_charge_limit
        name: Set target %
        mode: box
      - entity: sensor.scylla_rated_battery_range_mi
        name: Rated range (mi)
      - entity: input_number.scylla_target_range_mi
        name: Set target range (mi)
        mode: box
      - entity: sensor.scylla_charging_amps
        name: Charging amps (live / planned)
      - entity: input_number.scylla_set_charging_amps
        name: Set amperage
        mode: box
      - entity: input_select.scylla_charging_speed
        name: Charging speed
      # ON = the scheduler manages charging here (see input_text.scylla_charging_locations)
      - entity: binary_sensor.scylla_at_charging_location
        name: At a charging location


  # ── Voltage and phase info ────────────────────────────────────────────────
  - type: markdown
    content: >
      {% set slow_v = states('input_number.scylla_slow_voltage') | int(120) %}
      {% set fast_v = states('input_number.scylla_fast_voltage') | int(240) %}
      {% set live_voltage = states('sensor.scylla_charger_voltage') | float(0) %}
      {% set phases = states('sensor.scylla_charger_phases') | int(1) %}
      {% set slow_phases = 1 if slow_v < 200 else phases %}
      {% set fast_phases = 2 if fast_v >= 400 else (1 if fast_v < 200 else phases) %}
      🐢 Slow: **{{ slow_v }}V** · {{ slow_phases }} phase{% if slow_phases > 1 %}s{% endif %}
      &nbsp;&nbsp;|&nbsp;&nbsp;
      ⚡ Fast: **{{ fast_v }}V** · {{ fast_phases }} phase{% if fast_phases > 1 %}s{% endif %}
      {% if live_voltage > 75 %}
      &nbsp;&nbsp;|&nbsp;&nbsp; 🔌 Live: **{{ live_voltage | int }}V** · {{ phases }} phase{% if phases > 1 %}s{% endif %}
      {% endif %}

  # ── Target range → % (the range is a minimum: it only raises the target) ─
  - type: conditional
    conditions:
      - condition: numeric_state
        entity: input_number.scylla_target_range_mi
        above: 0
    card:
      type: markdown
      content: >
        {% set target_range = states('input_number.scylla_target_range_mi') | float(0) %}
        {% set needed = state_attr('sensor.scylla_charge_target_pct', 'range_needed_pct') | int(0) %}
        {% set limit_target = state_attr('sensor.scylla_charge_target_pct', 'limit_target') | int(0) %}
        {% if needed <= 0 %}
          📍 {{ target_range | int }} mi → waiting for the car's range reading
        {% elif needed > 100 %}
          📍 {{ target_range | int }} mi → **{{ needed }}%** ⚠️ Not reachable on one charge — will charge to 100%
        {% elif needed > limit_target %}
          📍 {{ target_range | int }} mi → **{{ needed }}%** (raises the target from {{ limit_target }}%)
        {% else %}
          📍 {{ target_range | int }} mi → {{ needed }}% — your {{ limit_target }}% target already covers it
        {% endif %}

  # ── Charge history ───────────────────────────────────────────────────────
  - type: history-graph
    entities:
      - entity: switch.scylla_charger
        name: Charger
    refresh_interval: 1
    hours_to_show: 12

  # ── Return home info (only when away) ───────────────────────────────────
  - type: conditional
    conditions:
      - condition: state
        entity: device_tracker.scylla_location
        state_not: "home"
    card:
      type: markdown
      content: >
        {% set current_pct = states('sensor.scylla_usable_battery_level') | float(0) %}
        {% set return_pct = states('sensor.scylla_return_home_battery_pct') | int(0) %}
        {% set distance_km = state_attr('sensor.waze_scylla_to_home', 'distance') | float(0) %}
        {% set distance_mi = (distance_km * 0.621371) | round(0) | int %}
        {% set duration = state_attr('sensor.waze_scylla_to_home', 'duration') | float(0) %}
        {% set h = (duration // 60) | int %}
        {% set m = (duration % 60) | int %}
        {% set time_str = h ~ 'h ' ~ m ~ 'min' if h > 0 else m ~ ' min' %}
        {% if return_pct > 100 %}
        🏠 **{{ distance_mi }} mi** home ({{ time_str }}) — needs **{{ return_pct }}%** ⚠️ Not enough charge to make it home!
        {% elif current_pct < return_pct %}
        🏠 **{{ distance_mi }} mi** home ({{ time_str }}) — needs **{{ return_pct }}%** ⚠️ Current battery too low to get home!
        {% else %}
        🏠 **{{ distance_mi }} mi** home ({{ time_str }}) — needs **{{ return_pct }}%** ({{ (current_pct - return_pct) | int }}% to spare)
        {% endif %}

  # ── NMC/NCA warning (hidden when battery protection is off, e.g. LFP) ───
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.scylla_battery_protection_enabled
        state: "on"
      - condition: numeric_state
        entity: sensor.scylla_charge_target_pct
        above: 90
    card:
      type: markdown
      content: >
        🔴 Warning: charging above 90% accelerates NMC/NCA battery degradation
